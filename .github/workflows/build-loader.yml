name: Build DYGO Loader

# Membangun ekstensi loader C untuk banyak versi PHP (Linux + macOS), lalu
# mengunggahnya sebagai artifact (dan sebagai aset Release bila dipicu tag vX.Y.Z).
#
# Windows: build ekstensi C dari source di CI tidak andal (perlu php-sdk + MSVC),
# jadi TIDAK dibangun otomatis di sini. Di Windows gunakan loader PHP murni
# (tanpa compile) — lihat docs/INSTALL.md — atau build DLL manual.
#
# PENTING soal master key:
#   - Set Secret repo DYGO_MASTER_KEY (hex 64 char) = isi keys/master.key.hex.
#   - Key ditanam ke biner saat build (ci/patch-key.php).
#   - Artifact/Release MENGANDUNG KEY ANDA → perlakukan sebagai RAHASIA (repo privat).
#   - Tanpa secret: build tetap jalan untuk uji kompilasi memakai key acak ephemeral.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} · PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Tanam master key ke header
        env:
          DYGO_MASTER_KEY: ${{ secrets.DYGO_MASTER_KEY }}
        run: php ci/patch-key.php

      - name: Build (phpize + make)
        working-directory: loader
        run: |
          phpize
          ./configure --enable-dygo-loader
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"

      - name: Organize artifact
        shell: bash
        run: |
          set -e
          ARCH="$(uname -m)"
          case "$ARCH" in x86_64) ARCH="x64";; aarch64|arm64) ARCH="arm64";; esac
          DEST="loader/prebuilt/php${{ matrix.php }}-nts-${ARCH}"
          mkdir -p "$DEST"
          cp loader/modules/dygo_loader.so "$DEST/dygo_loader.so"
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          ls -la "$DEST"

      - name: Smoke test (encode + jalankan via loader)
        shell: bash
        run: |
          set -e
          # keys/master.key.hex sudah diisi ci/patch-key.php
          php bin/dygo encode samples/hello.php -o /tmp/ci-hello.php
          SO="$PWD/loader/modules/dygo_loader.so"
          OUT="$(php -d extension="$SO" -r 'require "/tmp/ci-hello.php"; echo Acme\Secret::greet("CI");')"
          echo "$OUT"
          echo "$OUT" | grep -q "hasil = 1379"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dygo-loader-${{ matrix.os }}-php${{ matrix.php }}
          path: ${{ env.DEST }}/*
          if-no-files-found: error

  release:
    name: Attach to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download semua artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per-target
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: |
            Biner DYGO Loader (Linux + macOS, dibangun otomatis).

            ⚠️ Biner menanam master key dari secret DYGO_MASTER_KEY —
            perlakukan sebagai RAHASIA, jangan sebar ke publik.

            Pasang: letakkan dygo_loader.so di extension_dir PHP target lalu tambahkan
            extension=dygo_loader.so ke php.ini. Lihat docs/INSTALL.md.
            Windows: gunakan loader PHP murni (tanpa compile) — docs/INSTALL.md.
